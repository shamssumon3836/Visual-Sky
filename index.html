<!doctype html>
<html lang="en" style="background-color: #080c14; color: #f1f5f9;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisualSky - Cold Outreach &amp; Lead Engine</title>
    <meta name="description" content="Enterprise-grade AI lead intelligence, outbound SMTP relays, cold email sequences, multi-platform lead miner, unified inbox, and client CRM." />
    <meta property="og:title" content="VisualSky - Cold Outreach &amp; Lead Engine" />
    <meta property="og:description" content="Enterprise-grade AI lead intelligence, outbound SMTP relays, cold email sequences, multi-platform lead miner, unified inbox, and client CRM." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body style="background-color: #080c14; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="vs-boot-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#080c14;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;gap:12px;">
        <div style="width:36px;height:36px;border:3px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:vsSpin 0.8s linear infinite;"></div>
        <div style="font-size:14px;letter-spacing:0.04em;color:#e2e8f0;font-weight:600;">VisualSky Engine Loading...</div>
      </div>
      <style>@keyframes vsSpin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        // Universal production loader for cPanel / static document-root serving
        function bootProductionBundle() {
          if (window.__vite_plugin_react_preamble_installed__) return;
          if (document.getElementById('vs-prebuilt-bundle')) return;

          // Load Tailwind v4 browser engine + custom styles
          var tw = document.createElement('script');
          tw.src = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';
          document.head.appendChild(tw);

          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = '/prebuilt/app.css';
          document.head.appendChild(css);

          // Wake up Passenger backend first (triggers esbuild on first request if needed), then load app.js
          fetch('/api/health', { cache: 'no-store' })
            .catch(function () {})
            .finally(function () {
              var script = document.createElement('script');
              script.id = 'vs-prebuilt-bundle';
              script.type = 'module';
              script.src = '/prebuilt/app.js?v=' + Date.now();
              document.body.appendChild(script);
            });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            setTimeout(bootProductionBundle, 40);
          });
        } else {
          setTimeout(bootProductionBundle, 40);
        }
      })();
    </script>
  </body>
</html>
