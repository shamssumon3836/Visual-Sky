  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisualSky - Cold Outreach &amp; Lead Engine</title>
    <meta name="description" content="Enterprise-grade AI lead intelligence, outbound SMTP relays, cold email sequences, multi-platform lead miner, unified inbox, and client CRM." />
    <meta property="og:title" content="VisualSky - Cold Outreach &amp; Lead Engine" />
    <meta property="og:description" content="Enterprise-grade AI lead intelligence, outbound SMTP relays, cold email sequences, multi-platform lead miner, unified inbox, and client CRM." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/prebuilt/app.css?v=20260928-v6" />
    <style>
      .vs-auth-popup-window {
        width: 100% !important;
        max-width: 420px !important;
        max-height: 88vh !important;
        overflow-y: auto !important;
        margin: auto !important;
        border-radius: 16px !important;
      }
      .vs-legal-popup-window {
        width: 100% !important;
        max-width: 460px !important;
        max-height: 82vh !important;
        margin: auto !important;
        border-radius: 16px !important;
      }
    </style>
  </head>
  <body style="background-color: #080c14; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="vs-boot-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#080c14;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;gap:12px;">
        <div style="width:36px;height:36px;border:3px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:vsSpin 0.8s linear infinite;"></div>
        <div style="font-size:14px;letter-spacing:0.04em;color:#e2e8f0;font-weight:600;">VisualSky Engine Loading...</div>
      </div>
      <style>@keyframes vsSpin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        // Production loader for cPanel / static document-root serving
        function injectPrebuiltScript() {
          if (document.getElementById('vs-prebuilt-bundle')) return;
          var script = document.createElement('script');
          script.id = 'vs-prebuilt-bundle';
          script.type = 'module';
          script.src = '/prebuilt/app.js?v=20260928-v6&t=' + Date.now();
          document.body.appendChild(script);
        }

        function bootProductionBundle() {
          // If Vite dev server is active or Vite's built /assets/index-*.js is already present, do not double-inject
          if (
            window.__vite_plugin_react_preamble_installed__ ||
            document.querySelector('script[src*="@vite/client"]') ||
            document.querySelector('script[src*="/assets/index-"]')
          ) {
            return;
          }
          if (document.getElementById('vs-prebuilt-bundle')) return;

          // Wake up Passenger backend first so app.cjs compiles latest src/main.tsx & server.ts before serving app.js
          var loaded = false;
          var fallbackTimer = setTimeout(function () {
            if (!loaded) {
              loaded = true;
              injectPrebuiltScript();
            }
          }, 3500);

          fetch('/api/health?t=' + Date.now(), { cache: 'no-store' })
            .then(function () {
              if (!loaded) {
                loaded = true;
                clearTimeout(fallbackTimer);
                injectPrebuiltScript();
              }
            })
            .catch(function () {
              if (!loaded) {
                loaded = true;
                clearTimeout(fallbackTimer);
                injectPrebuiltScript();
              }
            });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bootProductionBundle);
        } else {
          bootProductionBundle();
        }
      })();
    </script>
  </body>
</html>
